name: ✨ Feature Request
description: 新功能建议 / Suggest a feature
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        仅用于提出新功能或改进建议
        For new features or improvements only

  - type: textarea
    id: request
    attributes:
      label: 需求说明 / Request
      description: 说明期望能力及使用场景 / Describe the feature and why you need it
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 方案建议 / Proposal
      description: 可选。如有想法，可描述期望的实现方式或参考案例 / Optional. Share how you think it should work, or similar examples

  - type: checkboxes
    id: area
    attributes:
      label: 涉及方向 / Area
      options:
        - label: 隧道协议 / Tunnel
        - label: 传输层 / Transport
        - label: 安全鉴权 / Auth & TLS
        - label: 仪表盘 / Dashboard
        - label: 桌面端 / Desktop
        - label: Docker 部署 / Docker
        - label: Java 客户端 / Java Client
        - label: 文档 / Docs
        - label: 其他 / Others

  - type: textarea
    id: extra
    attributes:
      label: 补充信息 / Extra
      description: 可选 / Optional
