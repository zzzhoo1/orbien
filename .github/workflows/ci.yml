          echo "PASS: burst 50 packets"

      # ── Case 3: large packet (4 KB) ───────────────────────────────────────────
      - name: "UDP E2E – 3: large packet (4 KB)"
        shell: bash
        run: |
          set -euo pipefail

          cat > orbien-server.toml <<'EOF'
