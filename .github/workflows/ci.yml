name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "doc/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "doc/**"

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.88"
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ── Node / web assets ──────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server-ui/package-lock.json

      - name: Build web assets
        working-directory: server-ui
        run: |
          npm ci
          npm run build
        # Vite outputs directly to ../server/assets (see vite.config.ts)

      # ── Rust ───────────────────────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.os }}-v1

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          vcpkg install openssl:x64-windows-static-md
          Add-Content $env:GITHUB_ENV "OPENSSL_DIR=$vcpkgRoot/installed/x64-windows-static-md"
          Add-Content $env:GITHUB_ENV "OPENSSL_STATIC=1"
          Add-Content $env:GITHUB_ENV "OPENSSL_NO_VENDOR=1"

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo clippy
        run: cargo clippy --workspace --locked -- -D warnings
