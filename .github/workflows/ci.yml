name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.88"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server-ui/package-lock.json

      - name: Build server-ui
        working-directory: server-ui
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: portable-cpu-v1

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --locked --all-targets

      - name: test
        run: cargo test --workspace --locked

      - name: build release bins
        run: cargo build --release --locked -p orbien-server -p orbien-client

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: orbien-bins
          path: |
            target/release/orbien-server
            target/release/orbien
          retention-days: 1

  e2e-tcp:
    name: E2E – TCP tunnel
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: orbien-bins
          path: bins

      - name: Make binaries executable
        run: chmod +x bins/orbien-server bins/orbien

      - name: Run E2E TCP tunnel
        shell: bash
        run: |
          set -euo pipefail

          cat > orbien-server.toml <<'EOF'
          bindAddr = "0.0.0.0"
          bindPort = 9527
          EOF

          cat > orbien.toml <<'EOF'
          serverAddr = "127.0.0.1"
          serverPort = 9527

          [[proxies]]
          name       = "echo"
          type       = "tcp"
          localIP    = "127.0.0.1"
          localPort  = 7000
          remotePort = 16000
          EOF

          cleanup() {
            set +e
            if [ -n "${CLIENT_PID:-}" ]; then kill "$CLIENT_PID" 2>/dev/null || true; fi
            if [ -n "${SERVER_PID:-}" ]; then kill "$SERVER_PID" 2>/dev/null || true; fi
            if [ -n "${ECHO_PID:-}" ]; then kill "$ECHO_PID" 2>/dev/null || true; fi
            wait "${CLIENT_PID:-}" 2>/dev/null || true
            wait "${SERVER_PID:-}" 2>/dev/null || true
            wait "${ECHO_PID:-}" 2>/dev/null || true
          }
          trap cleanup EXIT

          python3 -u - <<'PY' > /tmp/echo.log 2>&1 &
          import socketserver
          class EchoHandler(socketserver.BaseRequestHandler):
              def handle(self):
                  while True:
                      data = self.request.recv(65536)
                      if not data:
                          break
                      self.request.sendall(data)
          class ThreadedTCPServer(socketserver.ThreadingTCPServer):
              allow_reuse_address = True
          with ThreadedTCPServer(("127.0.0.1", 7000), EchoHandler) as server:
              server.serve_forever()
          PY
          ECHO_PID=$!

          stdbuf -oL -eL bins/orbien-server -c orbien-server.toml > /tmp/server.log 2>&1 &
          SERVER_PID=$!

          for i in $(seq 1 40); do
            if nc -z 127.0.0.1 9527; then
              echo "server ready"
              break
            fi
            sleep 0.25
          done
          nc -z 127.0.0.1 9527 || { echo "orbien-server failed to start"; cat /tmp/server.log; exit 1; }

          stdbuf -oL -eL bins/orbien -c orbien.toml > /tmp/client.log 2>&1 &
          CLIENT_PID=$!

          for i in $(seq 1 80); do
            if nc -z 127.0.0.1 16000; then
              echo "tunnel ready"
              break
            fi
            sleep 0.25
          done
          nc -z 127.0.0.1 16000 || {
            echo "tunnel failed to establish"
            echo "=== server ===" && cat /tmp/server.log
            echo "=== client ===" && cat /tmp/client.log
            echo "=== echo ===" && cat /tmp/echo.log
            exit 1
          }

          PAYLOAD="orbien-e2e-$(date +%s)"
          RESPONSE=$(printf '%s' "$PAYLOAD" | nc -w 3 127.0.0.1 16000)
          echo "Sent:     $PAYLOAD"
          echo "Received: $RESPONSE"
          if [ "$RESPONSE" != "$PAYLOAD" ]; then
            echo "response mismatch"
            echo "=== server ===" && cat /tmp/server.log
            echo "=== client ===" && cat /tmp/client.log
            echo "=== echo ===" && cat /tmp/echo.log
            exit 1
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            /tmp/server.log
            /tmp/client.log
            /tmp/echo.log

  e2e-http:
    name: E2E – HTTP tunnel
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: orbien-bins
          path: bins

      - name: Make binaries executable
        run: chmod +x bins/orbien-server bins/orbien

      - name: Run E2E HTTP tunnel
        shell: bash
        run: |
          set -euo pipefail

          cat > orbien-server.toml <<'EOF'
          bindAddr = "0.0.0.0"
          bindPort = 9527
          vhostHTTPPort = 18080
          subDomainHost = "test.local"
          EOF

          cat > orbien.toml <<'EOF'
          serverAddr = "127.0.0.1"
          serverPort = 9527

          [[proxies]]
          name      = "web"
          type      = "http"
          localIP   = "127.0.0.1"
          localPort = 17070
          subdomain = "demo"
          EOF

          cleanup() {
            set +e
            if [ -n "${CLIENT_PID:-}" ]; then kill "$CLIENT_PID" 2>/dev/null || true; fi
            if [ -n "${SERVER_PID:-}" ]; then kill "$SERVER_PID" 2>/dev/null || true; fi
            if [ -n "${HTTP_PID:-}" ]; then kill "$HTTP_PID" 2>/dev/null || true; fi
            wait "${CLIENT_PID:-}" 2>/dev/null || true
            wait "${SERVER_PID:-}" 2>/dev/null || true
            wait "${HTTP_PID:-}" 2>/dev/null || true
          }
          trap cleanup EXIT

          python3 -u - <<'PY' > /tmp/http-upstream.log 2>&1 &
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  body = f"orbien-http-ok path={self.path} host={self.headers.get('Host','')}".encode()
                  self.send_response(200)
                  self.send_header('Content-Type', 'text/plain; charset=utf-8')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, fmt, *args):
                  pass
          ThreadingHTTPServer(("127.0.0.1", 17070), Handler).serve_forever()
          PY
          HTTP_PID=$!

          stdbuf -oL -eL bins/orbien-server -c orbien-server.toml > /tmp/server.log 2>&1 &
          SERVER_PID=$!

          for i in $(seq 1 40); do
            if nc -z 127.0.0.1 9527 && nc -z 127.0.0.1 18080; then
              echo "server ready"
              break
            fi
            sleep 0.25
          done
          nc -z 127.0.0.1 9527 || { echo "orbien-server control failed to start"; cat /tmp/server.log; exit 1; }
          nc -z 127.0.0.1 18080 || { echo "orbien-server http vhost failed to start"; cat /tmp/server.log; exit 1; }

          stdbuf -oL -eL bins/orbien -c orbien.toml > /tmp/client.log 2>&1 &
          CLIENT_PID=$!

          for i in $(seq 1 80); do
            if curl -fsS -H 'Host: demo.test.local' http://127.0.0.1:18080/healthz >/tmp/http-response.txt 2>/dev/null; then
              echo "http tunnel ready"
              break
            fi
            sleep 0.25
          done

          if ! curl -fsS -H 'Host: demo.test.local' http://127.0.0.1:18080/healthz >/tmp/http-response.txt; then
            echo "http tunnel failed"
            echo "=== server ===" && cat /tmp/server.log
            echo "=== client ===" && cat /tmp/client.log
            echo "=== upstream ===" && cat /tmp/http-upstream.log
            exit 1
          fi

          RESPONSE=$(cat /tmp/http-response.txt)
          echo "Response: $RESPONSE"
          printf '%s' "$RESPONSE" | grep -F 'orbien-http-ok path=/healthz host=demo.test.local' >/dev/null || {
            echo "unexpected http response"
            echo "=== server ===" && cat /tmp/server.log
            echo "=== client ===" && cat /tmp/client.log
            echo "=== upstream ===" && cat /tmp/http-upstream.log
            exit 1
          }

      - name: Upload HTTP logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-http-logs
          path: |
            /tmp/server.log
            /tmp/client.log
            /tmp/http-upstream.log
            /tmp/http-response.txt
