name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.92"

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            V="$INPUT_VERSION"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          # Strip any accidental leading 'v' (e.g. user types "v1.2.3" in workflow_dispatch)
          V="${V#v}"
          if [ -z "$V" ]; then
            echo "version is empty" >&2
            exit 1
          fi
          # Normalize to X.Y.Z[-pre]: split off pre-release, pad core to 3 segments.
          # Examples: "0.3-1" -> "0.3.0-1", "0.3" -> "0.3.0", "1.2.3-beta" -> "1.2.3-beta"
          PRE=""
          CORE="$V"
          if [[ "$V" == *-* ]]; then
            CORE="${V%%-*}"
            PRE="-${V#*-}"
          fi
          DOTS="${CORE//[^.]}"
          if [ ${#DOTS} -eq 0 ]; then CORE="${CORE}.0.0"
          elif [ ${#DOTS} -eq 1 ]; then CORE="${CORE}.0"
          fi
          V="${CORE}${PRE}"
          CARGO_V="$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")"
          if [ "$CARGO_V" != "$V" ]; then
            echo "version mismatch: release=$V workspace=$CARGO_V" >&2
            echo "update [workspace.package] version in Cargo.toml before tagging/releasing" >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Release version: $V (matches Cargo workspace)"

  build-cli:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64
            libc: gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            goos: linux
            goarch: amd64
            libc: musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            goos: linux
            goarch: arm64
            libc: gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            goos: linux
            goarch: arm64
            libc: musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            goos: windows
            goarch: amd64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            goos: windows
            goarch: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            goos: darwin
            goarch: amd64
          - os: macos-14
            target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server-ui/package-lock.json

      - name: Build server-ui
        working-directory: server-ui
        run: |
          npm ci
          npm run build

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools perl

      - name: Install OpenSSL — Windows x64 (vcpkg)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: powershell
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          vcpkg install openssl:x64-windows-static-md
          Add-Content $env:GITHUB_ENV "OPENSSL_DIR=$vcpkgRoot/installed/x64-windows-static-md"
          Add-Content $env:GITHUB_ENV "OPENSSL_STATIC=1"
          Add-Content $env:GITHUB_ENV "OPENSSL_NO_VENDOR=1"

      - name: Install OpenSSL — Windows ARM64 (vcpkg)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: powershell
        run: |
          # windows-11-arm runner ships vcpkg; arm64-windows-static-md avoids any
          # Perl dependency entirely — no vendored source build needed.
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          vcpkg install openssl:arm64-windows-static-md
          Add-Content $env:GITHUB_ENV "OPENSSL_DIR=$vcpkgRoot/installed/arm64-windows-static-md"
          Add-Content $env:GITHUB_ENV "OPENSSL_STATIC=1"
          Add-Content $env:GITHUB_ENV "OPENSSL_NO_VENDOR=1"

      # Pinned to commit SHA to prevent supply-chain attacks via mutable ref
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: cli-${{ matrix.target }}-v2

      - name: Build orbien-server + orbien
        shell: bash
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo build --release --locked \
            -p orbien-server -p orbien-client \
            --target ${{ matrix.target }}

      - name: Package tarballs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/pack-release.sh
          VERSION="${{ needs.meta.outputs.version }}"
          TARGET="${{ matrix.target }}"
          OUT="dist/release"
          EXT=""
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            EXT=".exe"
          fi
          BIN_DIR="target/${TARGET}/release"
          LIBC="${{ matrix.libc }}"

          pack_one() {
            local name="$1"
            local bin="$2"
            local conf="$3"
            if [[ -n "$LIBC" ]]; then
              ./scripts/pack-release.sh \
                --name "$name" \
                --version "$VERSION" \
                --os "${{ matrix.goos }}" \
                --arch "${{ matrix.goarch }}" \
                --libc "$LIBC" \
                --outdir "$OUT" \
                --bin "$bin" \
                --config "$conf"
            else
              ./scripts/pack-release.sh \
                --name "$name" \
                --version "$VERSION" \
                --os "${{ matrix.goos }}" \
                --arch "${{ matrix.goarch }}" \
                --outdir "$OUT" \
                --bin "$bin" \
                --config "$conf"
            fi
          }

          pack_one orbien-server \
            "${BIN_DIR}/orbien-server${EXT}" \
            conf/orbien-server.toml
          pack_one orbien \
            "${BIN_DIR}/orbien${EXT}" \
            conf/orbien.toml

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/release/*.tar.gz
          if-no-files-found: error

  build-cli-freebsd:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server-ui/package-lock.json

      - name: Build server-ui
        working-directory: server-ui
        run: |
          npm ci
          npm run build

      - name: Build & pack CLI on FreeBSD
        uses: vmactions/freebsd-vm@d0518f912576ae759075aa00fb9fe27037940271 # v1.5.4
        with:
          release: "14"
          arch: x86_64
          mem: 8192
          usesh: true
          sync: rsync
          copyback: true
          envs: "RUST_VERSION VERSION"
          prepare: |
            set -e
            pkg install -y bash curl git gmake pkgconf ca_root_nss
            export PATH="$HOME/.cargo/bin:/usr/local/bin:$PATH"
            if [ ! -x "$HOME/.cargo/bin/cargo" ]; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain "${RUST_VERSION}"
            fi
            . "$HOME/.cargo/env"
            rustup default "${RUST_VERSION}"
          run: |
            set -euo pipefail
            export PATH="$HOME/.cargo/bin:/usr/local/bin:$PATH"
            if [ -f "$HOME/.cargo/env" ]; then
              . "$HOME/.cargo/env"
            fi

            cargo build --release --locked -p orbien-server -p orbien-client
            ./target/release/orbien-server --help >/dev/null
            ./target/release/orbien --help >/dev/null

            OUT="dist/release"
            mkdir -p "$OUT"
            bash scripts/pack-release.sh \
              --name orbien-server \
              --version "$VERSION" \
              --os freebsd \
              --arch amd64 \
              --outdir "$OUT" \
              --bin target/release/orbien-server \
              --config conf/orbien-server.toml
            bash scripts/pack-release.sh \
              --name orbien \
              --version "$VERSION" \
              --os freebsd \
              --arch amd64 \
              --outdir "$OUT" \
              --bin target/release/orbien \
              --config conf/orbien.toml
            ls -lh "$OUT"
        env:
          RUST_VERSION: ${{ env.RUST_VERSION }}
          VERSION: ${{ needs.meta.outputs.version }}

      - name: Upload FreeBSD CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-freebsd-amd64
          path: dist/release/*.tar.gz
          if-no-files-found: error

  build-desktop:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: deb
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            artifact: deb
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact: windows
          - os: windows-11-arm
            goos: windows
            goarch: arm64
            artifact: windows
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            artifact: dmg
          - os: macos-14
            goos: darwin
            goarch: arm64
            artifact: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to commit SHA to prevent supply-chain attacks via mutable ref
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: desktop-${{ matrix.os }}-${{ matrix.goarch }}

      - name: Install Linux GUI deps
        if: matrix.artifact == 'deb'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev \
            libfontconfig1-dev

      - name: Build orbien-desktop
        shell: bash
        run: cargo build --release --locked -p orbien-desktop

      - name: Package macOS DMG
        if: matrix.artifact == 'dmg'
        shell: bash
        run: |
          chmod +x scripts/pack-desktop-macos.sh
          ./scripts/pack-desktop-macos.sh \
            --version "${{ needs.meta.outputs.version }}" \
            --arch "${{ matrix.goarch }}" \
            --outdir dist/desktop

      - name: Install OpenSSL — Windows x64 desktop (vcpkg)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: powershell
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          vcpkg install openssl:x64-windows-static-md
          Add-Content $env:GITHUB_ENV "OPENSSL_DIR=$vcpkgRoot/installed/x64-windows-static-md"
          Add-Content $env:GITHUB_ENV "OPENSSL_STATIC=1"
          Add-Content $env:GITHUB_ENV "OPENSSL_NO_VENDOR=1"

      - name: Install OpenSSL — Windows ARM64 desktop (vcpkg)
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: powershell
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          vcpkg install openssl:arm64-windows-static-md
          Add-Content $env:GITHUB_ENV "OPENSSL_DIR=$vcpkgRoot/installed/arm64-windows-static-md"
          Add-Content $env:GITHUB_ENV "OPENSSL_STATIC=1"
          Add-Content $env:GITHUB_ENV "OPENSSL_NO_VENDOR=1"

      # Pinned to commit SHA to prevent supply-chain attacks via mutable ref
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            desktop/src-tauri -> target
          key: desktop-${{ matrix.target }}-v2

      # ── Version sync BEFORE npm ci so package-lock.json is consistent ──
      - name: Sync desktop version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.meta.outputs.version }}"

          # TAURI_VERSION: strict X.Y.Z — drop any pre-release suffix entirely.
          # Tauri 2 rejects anything that isn't a plain semver triple.
          TAURI_VERSION="${VERSION%%-*}"
          # Safety: ensure exactly 3 dot-segments
          DOTS="${TAURI_VERSION//[^.]}"
          if [ ${#DOTS} -eq 0 ]; then TAURI_VERSION="${TAURI_VERSION}.0.0"
          elif [ ${#DOTS} -eq 1 ]; then TAURI_VERSION="${TAURI_VERSION}.0"
          fi
          if [[ ! "$TAURI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::TAURI_VERSION '${TAURI_VERSION}' is not X.Y.Z" >&2
            exit 1
          fi

          export TAURI_VERSION
          echo "release version : ${VERSION}"
          echo "tauri version   : ${TAURI_VERSION}"

          # Update tauri.conf.json, package.json, and package-lock.json
          node - "$TAURI_VERSION" <<'EOF'
          const fs = require("fs");
          const version = process.argv[2];

          // tauri.conf.json — must be strict X.Y.Z
          const confPath = "desktop/src-tauri/tauri.conf.json";
          const conf = JSON.parse(fs.readFileSync(confPath, "utf8"));
          conf.version = version;
          fs.writeFileSync(confPath, JSON.stringify(conf, null, 2) + "\n");

          // package.json
          const pkgPath = "desktop/package.json";
          const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
          pkg.version = version;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");

          // package-lock.json — keep root + packages[""] in sync so npm ci is happy
          const lockPath = "desktop/package-lock.json";
          if (fs.existsSync(lockPath)) {
            const lock = JSON.parse(fs.readFileSync(lockPath, "utf8"));
            lock.version = version;
            if (lock.packages && lock.packages[""]) {
              lock.packages[""].version = version;
            }
            fs.writeFileSync(lockPath, JSON.stringify(lock, null, 2) + "\n");
          }
          EOF

          # Cargo.toml
          sed -i.bak -E \
            "s/^version = \".*\"/version = \"${TAURI_VERSION}\"/" \
            desktop/src-tauri/Cargo.toml
          rm -f desktop/src-tauri/Cargo.toml.bak

      - name: Install npm deps
        working-directory: desktop
        run: npm ci

      - name: Build orbien CLI sidecar
        shell: bash
        env:
          CI: "true"
        run: |
          set -euo pipefail
          chmod +x scripts/prepare-desktop-sidecar.sh
          TARGET="${{ matrix.target }}"
          ./scripts/prepare-desktop-sidecar.sh "$TARGET"
          EXT=""
          case "$TARGET" in *windows*) EXT=".exe" ;; esac
          SIDE="desktop/src-tauri/binaries/orbien-${TARGET}${EXT}"
          if [[ ! -f "$SIDE" ]]; then
            echo "missing sidecar for Tauri externalBin: $SIDE" >&2
            ls -la desktop/src-tauri/binaries/ || true
            exit 1
          fi
          ls -lh "$SIDE"

      - name: Configure Apple code signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE}" ]; then
            echo "APPLE_CERTIFICATE not configured — ad-hoc signing (signingIdentity=-)"
            exit 0
          fi

          CERT_PATH="$RUNNER_TEMP/apple-cert.p12"
          if ! echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH" 2>/dev/null; then
            echo "::error::APPLE_CERTIFICATE is not valid base64. Export with: base64 -i DeveloperID.p12 | pbcopy"
            exit 1
          fi
          if [[ ! -s "$CERT_PATH" ]]; then
            echo "::error::APPLE_CERTIFICATE decoded to an empty file"
            exit 1
          fi
          echo "APPLE_CERTIFICATE decoded OK ($(wc -c < "$CERT_PATH") bytes)"
          rm -f "$CERT_PATH"

          {
            echo "APPLE_CERTIFICATE<<ORB_CERT_EOF"
            printf '%s\n' "$APPLE_CERTIFICATE"
            echo "ORB_CERT_EOF"
            echo "APPLE_CERTIFICATE_PASSWORD<<ORB_PASS_EOF"
            printf '%s\n' "${APPLE_CERTIFICATE_PASSWORD:-}"
            echo "ORB_PASS_EOF"
          } >> "$GITHUB_ENV"

          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            {
              echo "APPLE_SIGNING_IDENTITY<<ORB_ID_EOF"
              printf '%s\n' "$APPLE_SIGNING_IDENTITY"
              echo "ORB_ID_EOF"
            } >> "$GITHUB_ENV"
          fi

          node <<'EOF'
          const fs = require("fs");
          const p = "desktop/src-tauri/tauri.conf.json";
          const j = JSON.parse(fs.readFileSync(p, "utf8"));
          if (j.bundle?.macOS?.signingIdentity === "-") {
            delete j.bundle.macOS.signingIdentity;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            console.log("cleared ad-hoc signingIdentity so Developer ID can be inferred");
          }
          EOF

          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            {
              echo "APPLE_ID<<ORB_AID_EOF"
              printf '%s\n' "$APPLE_ID"
              echo "ORB_AID_EOF"
              echo "APPLE_PASSWORD<<ORB_APW_EOF"
              printf '%s\n' "$APPLE_PASSWORD"
              echo "ORB_APW_EOF"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "Notarization credentials exported"
          else
            echo "Developer ID cert exported; notarization secrets incomplete — skip notarization"
          fi

      - name: Validate Tauri version
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          CONF_VER="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          PKG_VER="$(node -p 'require("./package.json").version')"
          echo "tauri.conf.json version : $CONF_VER"
          echo "package.json version    : $PKG_VER"
          if [[ ! "$CONF_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tauri.conf.json version '$CONF_VER' is not valid X.Y.Z semver" >&2
            exit 1
          fi

      - name: Build Tauri installers
        working-directory: desktop

        shell: bash
        run: |
          chmod +x scripts/pack-desktop-linux-deb.sh
          ./scripts/pack-desktop-linux-deb.sh \
            --version "${{ needs.meta.outputs.version }}" \
            --arch "${{ matrix.goarch }}" \
            --outdir dist/desktop

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.zip
            dist/desktop/*.exe
            dist/desktop/*.deb
          if-no-files-found: error

  publish:
    needs: [meta, build-cli, build-cli-freebsd, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "*"
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          name: v${{ needs.meta.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.meta.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
