# Portable CPU baselines so CI artifacts and rust-cache objects stay valid
# across GitHub-hosted runners. `target-cpu=native` can SIGILL when a cached
# object is reused on a different CPU generation.
#
# x86-64-v2: SSE4.2 / POPCNT (broad server compatibility).
# apple-m1: reasonable Apple Silicon baseline.

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=neoverse-n1"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-m1"]
