[workspace]
resolver = "2"
members = [
    "core",
    "client",
    "server",
]
exclude = [
    "desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["orbien"]


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release-size]
inherits = "release"
opt-level = "z"

[workspace.dependencies]
orbien-core = { path = "core" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "compat"] }
futures = "0.3"
yamux = "0.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
hmac = { version = "0.12", features = ["std"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
bytes = "1"
async-trait = "0.1"
quinn = "0.11"
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.13"
socket2 = "0.5"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
futures-util = "0.3"
kcp-tokio = "0.7"
httparse = "1"
axum = { version = "0.8", features = ["tokio", "http1"] }
rust-embed = "8"
hostname = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Force openssl-sys to vendor+compile OpenSSL from source.
# This avoids pkg-config cross-compilation failures on musl targets
# (aarch64/x86_64-unknown-linux-musl) where no system OpenSSL is available.
openssl = { version = "0.10", features = ["vendored"] }
