[package]
name = "orbien-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "orbien client — TCP proxy over TCP/QUIC"

[[bin]]
name = "orbien"
path = "src/main.rs"

[dependencies]
orbien-core = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
httparse = { workspace = true }
hostname = { workspace = true }
# Activate vendored OpenSSL so musl cross-compilation does not need pkg-config.
# kcp-tokio pulls in openssl-sys transitively; vendored builds it from source.
openssl = { version = "0.10", features = ["vendored"] }
