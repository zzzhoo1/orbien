[package]
name = "orbien-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Orbien client library and CLI"

[lib]
name = "orbien_client"
path = "src/lib.rs"

[[bin]]
name = "orbien"
path = "src/main.rs"

[dependencies]
orbien-core = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
httparse = { workspace = true }
hostname = { workspace = true }
kcp-tokio = { workspace = true }
fast-socks5 = "1.0"

# ── musl cross-compilation ──────────────────────────────────────────────────────────
# vendored feature builds OpenSSL from source — no pkg-config needed.
# kcp-tokio (via orbien-core) pulls in openssl-sys transitively;
# declaring it here forces the vendored path via cargo feature unification.
openssl = { version = "0.10", features = ["vendored"] }
