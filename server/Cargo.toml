[package]
name = "orbien-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "orbien server"

[[bin]]
name = "orbien-server"
path = "src/main.rs"

[dependencies]
orbien-core = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
quinn = { workspace = true }
kcp-tokio = { workspace = true }
httparse = { workspace = true }
rustls = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true }
rust-embed = { workspace = true }
chrono = { workspace = true }

# ── auth additions ───────────────────────────────────────────────────────────────
# Session tokens stored in memory (DashMap is a concurrent HashMap)
dashmap     = "6"
# WebAuthn ceremony logic
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
# Secure random token generation
rand        = "=0.10.2"
# Argon2 password hashing for the password-login path
argon2      = "0.5"

# ── musl cross-compilation ──────────────────────────────────────────────────────────
# vendored feature builds OpenSSL from source — no pkg-config needed.
# kcp-tokio pulls in openssl-sys; this forces the vendored path for all targets.
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
tokio       = { workspace = true }
serde_json  = { workspace = true }
tower       = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
