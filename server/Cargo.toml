[package]
name = "orbien-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "orbien server — TCP proxy over TCP/QUIC"

[[bin]]
name = "orbien-server"
path = "src/main.rs"

[dependencies]
orbien-core = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
async-trait = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
rustls-pemfile = { workspace = true }
rcgen = { workspace = true }
axum = { workspace = true }
rust-embed = { workspace = true }
chrono = { workspace = true }
httparse = { workspace = true }
base64 = { workspace = true }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
webauthn-rs = { version = "0.5", default-features = false, features = ["danger-allow-state-serialisation", "resident-key-support"] }
url = "2"
# Activate vendored OpenSSL so musl cross-compilation does not need pkg-config.
# kcp-tokio pulls in openssl-sys transitively; vendored builds it from source.
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
